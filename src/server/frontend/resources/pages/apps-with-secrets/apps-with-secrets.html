<section>
    <table id="apps-with-secrets-table">
        <thead>
            <tr>
                <th>Maintainer</th>
                <th>App</th>
                <th>Version</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody>
            {{if eq (len $.Page.Apps) 0}}
            <tr>
                <td colspan="4" style="opacity:.7">No apps with secrets available</td>
            </tr>
            {{else}}
            {{range $.Page.Apps}}
            {{$app := .}}

            <tr class="app-with-secrets-row" data-app-name="{{$app.AppName}}">
                <td class="app-secret-maintainer-cell">{{$app.Maintainer}}</td>
                <td class="app-secret-app-name-cell">{{$app.AppName}}</td>
                <td class="app-secret-version-cell">{{$app.VersionName}}</td>
                <td>
                    <div class="actions-row">
                        <button type="button"
                                class="lean icon-btn app-secret-show-button"
                                title="Show secrets"
                                aria-label="Show secrets"
                                onclick="location.href='{{$.Static.Paths.FrontendAppSecret}}?appId={{$app.AppId}}'">
                            <i class="mdi mdi-key-outline" aria-hidden="true"></i>
                        </button>
                    </div>
                </td>
            </tr>

            {{end}}
            {{end}}
        </tbody>
    </table>
</section>

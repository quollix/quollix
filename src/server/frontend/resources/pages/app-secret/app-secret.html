<button id="app-secret-back-button" type="button" class="lean" onclick="location.href='{{$.Static.Paths.FrontendAppsWithSecrets}}'">
    Back
</button>
<br>
<br>

<ul>
    <li id="app-secret-maintainer">Maintainer: {{$.Page.App.Maintainer}}</li>
    <li id="app-secret-app-name">App Name: {{$.Page.App.AppName}}</li>
    <li id="app-secret-version">Version: {{$.Page.App.VersionName}}</li>
</ul>

<section>
    <table id="app-secret-table">
        <thead>
            <tr>
                <th>Secret</th>
                <th>Value</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody>
            {{if eq (len $.Page.Secrets) 0}}
            <tr>
                <td colspan="3" style="opacity:.7">No secrets available</td>
            </tr>
            {{else}}
            {{range $.Page.Secrets}}
            {{$secret := .}}

            <tr class="app-secret-row" data-secret-name="{{$secret.Name}}">
                <td class="app-secret-name-cell mono">{{$secret.Name}}</td>
                <td class="app-secret-value-cell">
                    <span class="mono">****************</span>
                </td>
                <td>
                    <div class="actions-row">
                        <button type="button" class="lean icon-btn app-secret-copy-button" title="Copy secret"
                            aria-label="Copy secret" onclick="copyToClipboard('{{$secret.Value}}', '{{$secret.Name}}')">
                            <i class="mdi mdi-clipboard-outline" aria-hidden="true"></i>
                        </button>
                        <button type="button" class="lean icon-btn app-secret-regenerate-button"
                            title="Regenerate secret" aria-label="Regenerate secret"
                            onclick="regenerateAppSecret('{{$.Page.App.AppId}}', '{{$secret.Name}}')">
                            <i class="mdi mdi-refresh" aria-hidden="true"></i>
                        </button>
                    </div>
                </td>
            </tr>

            {{end}}
            {{end}}
        </tbody>
    </table>
</section>

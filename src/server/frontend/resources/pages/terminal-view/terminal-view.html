<link rel="stylesheet" href="{{.Static.Paths.WebResourcesVendorCss}}/xterm.{{.Frontend.Version}}.css" />
<script src="{{.Static.Paths.WebResourcesVendorJs}}/xterm.{{.Frontend.Version}}.js"></script>
<script src="{{.Static.Paths.WebResourcesVendorJs}}/xterm-addon-fit.{{.Frontend.Version}}.js"></script>

<button type="button" id="terminal-view-back-button" class="lean" onclick="location.href='{{$.Static.Paths.FrontendTerminalServices}}?maintainer={{$.Page.Maintainer}}&appName={{$.Page.AppName}}'">
    Back
</button>
<br>
<br>

<ul>
    <li id="terminal-view-maintainer">Maintainer: {{ $.Page.Maintainer }}</li>
    <li id="terminal-view-app-name">App Name: {{ $.Page.AppName }}</li>
    <li id="terminal-view-service-name">Service: {{ $.Page.ServiceName }}</li>
</ul>


<div id="terminal-container">
    <button type="button"
            id="terminal-copy-button"
            class="lean"
            title="Copy terminal"
            aria-label="Copy terminal"
            onclick="copyTerminalToClipboard()">
        <i class="mdi mdi-content-copy"></i>
    </button>
    <div id="terminal"></div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        window.initTerminalViewPage(
            location.host,
            "{{$.Page.Maintainer}}",
            "{{$.Page.AppName}}",
            "{{$.Page.ServiceName}}",
        );
    });
</script>

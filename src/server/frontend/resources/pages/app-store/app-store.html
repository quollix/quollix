<h3>Search menu</h3>
<form id="search-form" action="{{ $.Static.Paths.FrontendStore }}" method="get">
  <div id="maintainer-wrap" class="field">
    <label for="maintainer-input">Maintainer</label>
    <input id="maintainer-input" name="{{$.Static.QueryParams.Store.MaintainerName}}" type="text" placeholder="enter maintainer"
      value="{{$.Page.MaintainerSearchTerm}}">
  </div>

  <div class="field">
    <label for="app-input">App Name</label>
    <input id="app-input" name="{{$.Static.QueryParams.Store.AppName}}" type="text" placeholder="enter app name" value="{{$.Page.AppSearchTerm}}">
  </div>

  <div class="checkbox-group">
    <input id="unofficial" name="{{$.Static.QueryParams.Store.ShowUnofficial}}" type="checkbox" value="true" {{if
      $.Page.ShowUnofficialApps}}checked{{end}}>
    <label for="unofficial">Search for unofficial apps</label>
  </div>

  <!-- The backend only runs a search when this button is used. The presence of `is_search=true` distinguishes an initial page visit from an explicit search request. -->
  <button id="search-button" type="submit" name="{{$.Static.QueryParams.Store.IsSearch}}" value="true">Search</button>
</form>

<h3>Search results</h3>
<table id="store-results-table">
  <thead>
    <tr>
      <th>Maintainer</th>
      <th>App</th>
      <th>Version</th>
      <th>Created</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody id="store-results-body">
    {{if not $.Page.Apps}}
    <tr id="store-no-results-row">
      <td colspan="5" style="opacity:.7">No apps yet</td>
    </tr>
    {{else}}
    {{range $.Page.Apps}}
    {{$app := .}}
    <tr class="store-result-row" data-maintainer="{{$app.Maintainer}}" data-app="{{$app.AppName}}">
      <td class="store-result-maintainer">{{$app.Maintainer}}</td>
      <td class="store-result-app">{{$app.AppName}}</td>
      <td class="store-result-version">
        <button type="button" class="version-button store-version-button lean"
          onclick="goToVersions('{{$app.Maintainer}}','{{$app.AppName}}')">
          {{$app.LatestVersionName}}
        </button>
      </td>
      <td class="store-result-created-at">{{$app.LatestVersionCreationTimestamp}}</td>
      <td class="store-result-actions">
        <div class="actions-row">
          <button type="button" class="lean icon-btn store-install-button" title="Install/update app"
            aria-label="Install/update app" {{if not $app.CanInstall}}disabled aria-disabled="true"{{end}}{{if $app.CanInstall}} onclick="installAppFromStore('{{$app.Maintainer}}','{{$app.AppName}}',{{$app.LatestVersionId}})"{{end}}>
            <i class="mdi mdi-download-box-outline" aria-hidden="true"></i>
          </button>
          <button type="button" class="lean icon-btn store-download-button" title="Download app"
            aria-label="Download app"
            onclick="downloadStoreVersionForBrowser({{$app.LatestVersionId}})">
            <i class="mdi mdi-download-outline" aria-hidden="true"></i>
          </button>
        </div>
      </td>
    </tr>
    {{end}}
    {{end}}
  </tbody>
</table>
